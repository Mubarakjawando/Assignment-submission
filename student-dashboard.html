<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f0f4f8; padding: 20px; }
    .dashboard { max-width: 800px; margin: 0 auto; }

    .top-bar {
      background: #16a34a;
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .top-bar h2 { font-size: 18px; margin: 0; }
    .top-bar span { font-size: 13px; opacity: 0.85; }

    .logout-btn {
      background: white;
      color: #16a34a;
      border: 2px solid #16a34a;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      width: auto;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: #16a34a;
      color: white;
    }

    .stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: white;
      border-radius: 10px;
      padding: 16px 20px;
      flex: 1;
      min-width: 120px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .stat-card h3 { font-size: 28px; color: #22c55e; }
    .stat-card p { font-size: 12px; color: #888; margin-top: 4px; }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 16px;
      margin-top: 8px;
    }

    .course-section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .course-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f0f4f8;
    }

    .course-header h3 { color: #1a1a2e; font-size: 16px; }
    .course-header p { color: #888; font-size: 12px; margin-top: 2px; }

    .assignment-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .assignment-card:last-child { margin-bottom: 0; }
    .assignment-card h4 { color: #1a1a2e; margin-bottom: 6px; font-size: 15px; }
    .assignment-card p { color: #666; font-size: 13px; margin-bottom: 8px; }

    .badge {
      display: inline-block;
      background: #ecfdf5;
      color: #16a34a;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      margin-right: 6px;
    }

    .badge-lecturer {
      background: #dcfce7;
      color: #166534;
    }

    .deadline {
      font-size: 13px;
      color: #ef4444;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .deadline.safe { color: #16a34a; }

    .submit-section { margin-top: 12px; }

    .submit-section input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 2px dashed #d1d5db;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #f9fafb;
      cursor: pointer;
      font-size: 13px;
    }

    .submit-btn {
      background: #16a34a;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      width: auto;
      transition: all 0.3s ease;
    }

    .submit-btn:hover { 
      background: #15803d;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
    }

    .submitted-badge {
      display: inline-block;
      background: #dcfce7;
      color: #16a34a;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .score-badge {
      display: inline-block;
      background: #fef9c3;
      color: #854d0e;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-left: 8px;
    }

    .pending-badge {
      display: inline-block;
      background: #fff7ed;
      color: #c2410c;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;font-weight: 600;
      margin-left: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .loading { text-align: center; padding: 40px; color: #666; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="dashboard">

  <!-- Top Bar -->
  <div class="top-bar">
    <div>
      <h2> Student Dashboard</h2>
      <span id="student-info">Loading...</span>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- Stats Bar -->
  <div class="stats-bar">
    <div class="stat-card">
      <h3 id="stat-total">0</h3>
      <p>Total Assignments</p>
    </div>
    <div class="stat-card">
      <h3 id="stat-submitted">0</h3>
      <p>Submitted</p>
    </div>
    <div class="stat-card">
      <h3 id="stat-pending">0</h3>
      <p>Pending</p>
    </div>
    <div class="stat-card">
      <h3 id="stat-graded">0</h3>
      <p>Graded</p>
    </div>
  </div>

  <!-- Assignments Section -->
  <div class="section-title"> Your Assignments by Course</div>
  <div id="assignments-container">
    <div class="loading">Loading assignments...</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  var currentUser = null;
  var currentProfile = null;

  window.onload = async function() {
    var session = await supabaseClient.auth.getSession();
    if (!session.data.session) {
      window.location.href = 'index.html';
      return;
    }

    currentUser = session.data.session.user;

    var profile = await supabaseClient
      .from('users')
      .select('*')
      .eq('id', currentUser.id)
      .single();

    if (!profile.data || profile.data.role !== 'student') {
      window.location.href = 'index.html';
      return;
    }

    currentProfile = profile.data;
    document.getElementById('student-info').textContent =
      currentProfile.full_name + ' | ' + currentProfile.level +
      ' | Matric: ' + currentProfile.matric_number;

    loadAssignments();
  };

  async function loadAssignments() {
    var container = document.getElementById('assignments-container');

    // Get all courses for student's level
    var coursesResult = await supabaseClient
      .from('courses')
      .select('*, users(full_name)')
      .eq('level', currentProfile.level)
      .order('code');

    if (coursesResult.error || coursesResult.data.length === 0) {
      container.innerHTML = '<div class="empty-state">📭 No courses found for your level.</div>';
      return;
    }

    // Get all assignments for student's level
    var assignmentsResult = await supabaseClient
      .from('assignments')
      .select('*, courses(name, code)')
      .eq('level', currentProfile.level)
      .order('created_at', { ascending: false });

    if (assignmentsResult.error) {
      container.innerHTML = '<div class="empty-state">Error loading assignments.</div>';
      return;
    }

    // Get all submissions by this student
    var submissionsResult = await supabaseClient
      .from('submissions')
      .select('*')
      .eq('student_id', currentUser.id);

    var submissions = submissionsResult.data || [];
    var assignments = assignmentsResult.data || [];

    // Update stats
    var submitted = submissions.length;
    var graded = submissions.filter(function(s) { return s.score !== null; }).length;
    document.getElementById('stat-total').textContent = assignments.length;
    document.getElementById('stat-submitted').textContent = submitted;
    document.getElementById('stat-pending').textContent = assignments.length - submitted;
    document.getElementById('stat-graded').textContent = graded;

    if (assignments.length === 0) {
      container.innerHTML = '<div class="empty-state">📭 No assignments yet for your level.</div>';
      return;
    }

    container.innerHTML = '';

    // Group assignments by course
    coursesResult.data.forEach(function(course) {
      var courseAssignments = assignments.filter(function(a) {
        return a.course_id === course.id;
      });

      var lecturerName = course.users ? course.users.full_name : 'Unknown';

      var assignmentsHTML = '';

      if (courseAssignments.length === 0) {
        assignmentsHTML = '<p style="color:#aaa;font-size:13px;text-align:center;padding:16px;">No assignments yet for this course.</p>';
      } else {
        courseAssignments.forEach(function(a) {
          var submission = submissions.find(function(s) {
            return s.assignment_id === a.id;
          });

          var deadlineHTML = '';
          if (a.deadline) {
            var today = new Date();
            var deadline = new Date(a.deadline);
            var isSafe = deadline > today;
            deadlineHTML = '<div class="deadline ' + (isSafe ? 'safe' : '') + '"> Deadline: ' + a.deadline + '</div>';
          }

          var fileLink = a.file_url
            ? '<a href="' + a.file_url + '" target="_blank" style="font-size:13px;color:#4f46e5;display:block;margin-bottom:8px;">📎 View Assignment File</a>'
            : '';

          var submitHTML = '';
          if (submission) {
            var scoreHTML = submission.score !== null
              ? '<span class="score-badge">🏆 Score: ' + submission.score + '/100</span>'
              : '<span class="pending-badge">⏳ Awaiting Grade</span>';
            submitHTML = '<div style="margin-top:10px;"><span class="submitted-badge"> Submitted</span>' + scoreHTML + '</div>';
          } else {
            submitHTML =
              '<div class="submit-section">' +
                '<input type="file" id="file-' + a.id + '" accept=".pdf,image/*"/>' +
                '<button class="submit-btn" onclick="submitAssignment(\'' + a.id + '\')"> Submit Assignment</button>' +
                '<p id="msg-' + a.id + '" style="font-size:13px;margin-top:8px;"></p>' +
              '</div>';
          }

          assignmentsHTML +=
            '<div class="assignment-card">' +
              '<h4>' + a.title + '</h4>' +
              '<p>' + (a.description || 'No description.') + '</p>' +
              deadlineHTML +
              fileLink +
              submitHTML +
            '</div>';
        });
      }

      container.innerHTML +=
        '<div class="course-section">' +
          '<div class="course-header">' +
            '<div>' +
              '<h3> ' + course.name + '</h3>' +
              '<p>' + course.code + ' | Lecturer: ' + lecturerName + '</p>' +
            '</div>' +
            '<span class="badge">' + courseAssignments.length + ' assignment' + (courseAssignments.length !== 1 ? 's' : '') + '</span>' +
          '</div>' +
          assignmentsHTML +
        '</div>';
    });
  }

  async function submitAssignment(assignmentId) {
    var fileInput = document.getElementById('file-' + assignmentId);
    var msg = document.getElementById('msg-' + assignmentId);

    if (!fileInput.files[0]) {
      msg.textContent = 'Please select a file first.';
      msg.style.color = 'red';
      return;
    }

    var file = fileInput.files[0];
    var fileName = currentUser.id + '-' + assignmentId + '-' + Date.now() + '-' + file.name;

    msg.textContent = 'Uploading...';
    msg.style.color = '#4f46e5';

    var upload = await supabaseClient.storage
      .from('submissions')
      .upload(fileName, file);

    if (upload.error) {
      msg.textContent = 'Upload error: ' + upload.error.message;
      msg.style.color = 'red';
      return;
    }

    var urlData = supabaseClient.storage
      .from('submissions')
      .getPublicUrl(fileName);

    var insert = await supabaseClient
      .from('submissions')
      .insert([{
        student_id: currentUser.id,
        assignment_id: assignmentId,
        file_url: urlData.data.publicUrl
      }]);

    if (insert.error) {
      msg.textContent = 'Error: ' + insert.error.message;
      msg.style.color = 'red';
      return;
    }

    msg.textContent = ' Submitted!';
    msg.style.color = 'green';
    setTimeout(loadAssignments, 1500);
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  }
</script>

</body>
</html>
