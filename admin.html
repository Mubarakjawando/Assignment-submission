<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

body {
      background: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      background: #334155;
      border: 1px solid #475569;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
    }

    .icon {
      text-align: center;
      font-size: 48px;
      margin-bottom: 12px;
    }

    h2 {
      color: white;
      text-align: center;
      margin-bottom: 6px;
      font-size: 22px;
    }

    p.subtitle {
      color: #86efac;
      text-align: center;
      font-size: 13px;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #475569;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #1e293b;
      color: white;
    }

    input:focus { border-color: #22c55e; }
    input::placeholder { color: #86efac; }

    button {
      width: 100%;
      padding: 13px;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    button:hover { background: #16a34a; }

    .message {
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      margin-top: 14px;
    }

    .error { color: #f87171; }
    .loading { color: #94a3b8; }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="icon"></div>
    <h2>Admin Panel</h2>
    <p class="subtitle">Assignment Submission System</p>

    <input type="email" id="admin-email" placeholder="Admin Email"/>
    <input type="password" id="admin-password" placeholder="Admin Password"/>
    <button onclick="adminLogin()">Login as Admin</button>
    <p id="login-msg" class="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    // If already logged in go straight to dashboard
    window.onload = async function() {
      var session = await supabaseClient.auth.getSession();
      if (session.data.session) {
        window.location.href = 'admin-dashboard.html';
      }
    };

    async function adminLogin() {
      var email = document.getElementById('admin-email').value.trim();
      var password = document.getElementById('admin-password').value;
      var msg = document.getElementById('login-msg');

      if (!email || !password) {
        msg.textContent = 'Please enter email and password.';
        msg.className = 'message error';
        return;
      }

      msg.textContent = 'Logging in...';
      msg.className = 'message loading';

      var result = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (result.error) {
        msg.textContent = 'Error: ' + result.error.message;
        msg.className = 'message error';
        return;
      }

      // Check profile exists
      var profile = await supabaseClient
        .from('users')
        .select('role')
        .eq('id', result.data.user.id)
        .single();

      if (!profile.data) {
        msg.textContent = 'Access denied.';
        msg.className = 'message error';
        await supabaseClient.auth.signOut();
        return;
      }

      // Redirect to dashboard
      window.location.href = 'admin-dashboard.html';
    }

    // Allow Enter key to login
    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') adminLogin();
    });
  </script>

</body>
</html>
