<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lecturer Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f0f4f8; padding: 20px; }
    .dashboard { max-width: 900px; margin: 0 auto; }

    .top-bar {
      background: #166534;
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .top-bar h2 { font-size: 18px; }
    .top-bar span { font-size: 13px; opacity: 0.8; }

    .logout-btn {
      background: white;
      color: #16a34a;
      border: 2px solid #16a34a;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: #16a34a;
      color: white;
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 2px solid #166534;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      color: #166534;
      transition: all 0.3s ease;
    }

    .tab-btn:hover:not(.active) {
      border-color: #16a34a;
      color: #16a34a;
      transform: translateY(-1px);
    }

    .tab-btn.active { background: #16a34a; color: white; }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card h3 { font-size: 16px; margin-bottom: 16px; color: #1a1a2e; }

    input, select, textarea {
      width: 100%;
      padding: 11px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: #1a1a2e; }
    textarea { resize: vertical; min-height: 80px; }

    .btn {
      background: #16a34a;
      color: white;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .btn:hover { 
      background: #15803d;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
    }

    .btn-small {
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-grade { background: #22c55e; color: white; }

    .course-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .course-info h4 { color: #1a1a2e; font-size: 15px; }
    .course-info p { color: #666; font-size: 13px; margin-top: 4px; }

    .assignment-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .assignment-item h4 { color: #1a1a2e; margin-bottom: 6px; }
    .assignment-item p { color: #666; font-size: 13px; }

    .badge {
      display: inline-block;
      background: #ecfdf5;
      color: #16a34a;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 6px;
      margin-bottom: 8px;
    }

    .badge-course {
      background: #dcfce7;
      color: #16a34a;
    }

    .submission-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .submission-info h4 { font-size: 14px; color: #1a1a2e; }
    .submission-info p { font-size: 13px; color: #666; }

    .grade-section { display: flex; align-items: center; gap: 8px; }
    .grade-section input { width: 70px; margin: 0; padding: 7px; }

    .score-tag {
      background: #fef9c3;
      color: #854d0e;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
    }

    .message { margin-top: 12px; font-size: 14px; font-weight: 500; }
    .success { color: green; }
    .error { color: red; }
    .hidden { display: none; }
    .loading { text-align: center; padding: 30px; color: #888; }
    .empty { text-align: center; padding: 30px; color: #aaa; }
  </style>
</head>
<body>

<div class="dashboard">

  <div class="top-bar">
    <div>
      <h2> Lecturer Dashboard</h2>
      <span id="lecturer-name">Loading...</span>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('my-courses', this)"> My Courses</button>
    <button class="tab-btn" onclick="showTab('upload', this)"> Upload Assignment</button>
    <button class="tab-btn" onclick="showTab('assignments', this)"> My Assignments</button>
    <button class="tab-btn" onclick="showTab('submissions', this)"> Submissions</button>
  </div>

  <!-- MY COURSES TAB -->
  <div id="my-courses" class="tab-content">
    <div class="card">
      <h3> My Assigned Courses</h3>
      <div id="courses-list"><div class="loading">Loading courses...</div></div>
    </div>
  </div>

  <!-- UPLOAD ASSIGNMENT TAB -->
  <div id="upload" class="tab-content hidden">
    <div class="card">
      <h3>Upload New Assignment</h3>
      <select id="a-course">
        <option value="">-- Select Your Course --</option>
      </select>
      <input type="text" id="a-title" placeholder="Assignment Title"/>
      <textarea id="a-desc" placeholder="Assignment Description / Instructions"></textarea>
      <input type="date" id="a-deadline"/>
      <input type="file" id="a-file" accept=".pdf,image/*"/>
      <button class="btn" onclick="uploadAssignment()">Upload Assignment</button>
      <p id="upload-msg" class="message"></p>
    </div>
  </div>

  <!-- MY ASSIGNMENTS TAB -->
  <div id="assignments" class="tab-content hidden">
    <div class="card">
      <h3>My Uploaded Assignments</h3>
      <div id="assignments-list"><div class="loading">Loading...</div></div>
    </div>
  </div>

  <!-- SUBMISSIONS TAB -->
  <div id="submissions" class="tab-content hidden">
    <div class="card">
      <h3>Student Submissions</h3>
      <select id="filter-assignment" onchange="loadSubmissions()">
        <option value="">-- Select Assignment --</option>
      </select>
      <div id="submissions-list"><div class="empty">Select an assignment above.</div></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  var currentUser = null;
  var currentProfile = null;
  var myCourses = [];

  window.onload = async function() {
    var session = await supabaseClient.auth.getSession();
    if (!session.data.session) {
      window.location.href = 'index.html';
      return;
    }

    currentUser = session.data.session.user;

    var profile = await supabaseClient
      .from('users')
      .select('*')
      .eq('id', currentUser.id)
      .single();

    if (!profile.data || profile.data.role !== 'lecturer') {
      window.location.href = 'index.html';
      return;
    }

    currentProfile = profile.data;
    document.getElementById('lecturer-name').textContent =
      'Welcome, ' + currentProfile.full_name;

    loadMyCourses();
    loadMyAssignments();
    loadAssignmentFilter();
  };

  function showTab(tabName, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabName).classList.remove('hidden');
    btn.classList.add('active');
  }

  async function loadMyCourses() {
    var list = document.getElementById('courses-list');
    var result = await supabaseClient
      .from('courses')
      .select('*')
      .eq('lecturer_id', currentUser.id)
      .order('level');

    if (result.error || result.data.length === 0) {
      list.innerHTML = '<div class="empty">No courses assigned to you yet.</div>';
      return;
    }

    myCourses = result.data;
    list.innerHTML = '';

    result.data.forEach(function(c) {
      list.innerHTML +=
        '<div class="course-card">' +
          '<div class="course-info">' +
            '<h4>' + c.name + '</h4>' +
            '<p>Code: ' + c.code + '</p>' +
          '</div>' +
          '<span class="badge">' + c.level + '</span>' +
        '</div>';
    });

    populateCourseDropdown(result.data);
  }

  function populateCourseDropdown(courses) {
    var select = document.getElementById('a-course');
    select.innerHTML = '<option value="">-- Select Your Course --</option>';
    courses.forEach(function(c) {
      select.innerHTML +=
        '<option value="' + c.id + '">' + c.name + ' (' + c.level + ')</option>';
    });
  }

  async function uploadAssignment() {
    var courseId = document.getElementById('a-course').value;
    var title = document.getElementById('a-title').value.trim();
    var desc = document.getElementById('a-desc').value.trim();
    var deadline = document.getElementById('a-deadline').value;
    var file = document.getElementById('a-file').files[0];
    var msg = document.getElementById('upload-msg');

    if (!courseId || !title) {
      msg.textContent = 'Please select a course and enter a title.';
      msg.className = 'message error';
      return;
    }

    msg.textContent = 'Uploading...';
    msg.className = 'message';

    var selectedCourse = myCourses.find(function(c) { return c.id === courseId; });
    var fileUrl = null;

    if (file) {
      var fileName = 'assignments/' + currentUser.id + '-' + Date.now() + '-' + file.name;
      var upload = await supabaseClient.storage
        .from('submissions')
        .upload(fileName, file);

      if (upload.error) {
        msg.textContent = 'File upload error: ' + upload.error.message;
        msg.className = 'message error';
        return;
      }

      var urlData = supabaseClient.storage.from('submissions').getPublicUrl(fileName);
      fileUrl = urlData.data.publicUrl;
    }

    var insert = await supabaseClient.from('assignments').insert([{
      title: title,
      description: desc,
      level: selectedCourse.level,
      course_id: courseId,
      deadline: deadline || null,
      file_url: fileUrl,
      lecturer_id: currentUser.id
    }]);

    if (insert.error) {
      msg.textContent = 'Error: ' + insert.error.message;
      msg.className = 'message error';
      return;
    }

    msg.textContent = ' Assignment uploaded successfully!';
    msg.className = 'message success';

    document.getElementById('a-course').value = '';
    document.getElementById('a-title').value = '';
    document.getElementById('a-desc').value = '';
    document.getElementById('a-deadline').value = '';
    document.getElementById('a-file').value = '';

    loadMyAssignments();
    loadAssignmentFilter();
  }

  async function loadMyAssignments() {
    var list = document.getElementById('assignments-list');
    var result = await supabaseClient
      .from('assignments')
      .select('*, courses(name, code)')
      .eq('lecturer_id', currentUser.id)
      .order('created_at', { ascending: false });

    if (result.error || result.data.length === 0) {
      list.innerHTML = '<div class="empty">No assignments uploaded yet.</div>';
      return;
    }

    list.innerHTML = '';
    result.data.forEach(function(a) {
      var deadline = a.deadline ? ' ' + a.deadline : 'No deadline';
      var courseName = a.courses ? a.courses.name : 'Unknown Course';
      var fileLink = a.file_url
        ? '<a href="' + a.file_url + '" target="_blank" style="font-size:13px;color:#4f46e5;">📎 View File</a>'
        : '';

      list.innerHTML +=
        '<div class="assignment-item">' +
          '<span class="badge">' + a.level + '</span>' +
          '<span class="badge badge-course">' + courseName + '</span>' +
          '<h4>' + a.title + '</h4>' +
          '<p>' + (a.description || '') + '</p>' +
          '<p style="color:#999;font-size:12px;margin-top:6px;">' + deadline + '</p>' +
          fileLink +
        '</div>';
    });
  }

  async function loadAssignmentFilter() {
    var select = document.getElementById('filter-assignment');
    var result = await supabaseClient
      .from('assignments')
      .select('*, courses(name)')
      .eq('lecturer_id', currentUser.id)
      .order('created_at', { ascending: false });

    if (result.error) return;
    select.innerHTML = '<option value="">-- Select Assignment --</option>';
    result.data.forEach(function(a) {
      var courseName = a.courses ? a.courses.name : '';
      select.innerHTML +=
        '<option value="' + a.id + '">' + a.title + ' — ' + courseName + ' (' + a.level + ')</option>';
    });
  }

  async function loadSubmissions() {
    var assignmentId = document.getElementById('filter-assignment').value;
    var list = document.getElementById('submissions-list');

    if (!assignmentId) {
      list.innerHTML = '<div class="empty">Select an assignment above.</div>';
      return;
    }

    list.innerHTML = '<div class="loading">Loading submissions...</div>';

    var result = await supabaseClient
      .from('submissions')
      .select('*, users(full_name, matric_number, level)')
      .eq('assignment_id', assignmentId)
      .order('submitted_at', { ascending: false });

    if (result.error) {
      list.innerHTML = '<div class="error">Error loading.</div>';
      return;
    }

    if (result.data.length === 0) {
      list.innerHTML = '<div class="empty">No submissions yet.</div>';
      return;
    }

    list.innerHTML = '';
    result.data.forEach(function(s) {
      var student = s.users;
      var scoreHTML = s.score !== null
        ? '<span class="score-tag">Score: ' + s.score + '</span>'
        : '<div class="grade-section">' +
            '<input type="number" id="score-' + s.id + '" placeholder="0-100" min="0" max="100"/>' +
            '<button class="btn-small btn-grade" onclick="gradeSubmission(\'' + s.id + '\')">Save</button>' +
          '</div>';

      var fileLink = s.file_url
        ? '<a href="' + s.file_url + '" target="_blank" style="font-size:13px;color:#0ea5e9;">📎 View</a>'
        : 'No file';

      list.innerHTML +=
        '<div class="submission-item">' +
          '<div class="submission-info">' +
            '<h4>' + (student ? student.full_name : 'Unknown') + '</h4>' +
            '<p>Matric: ' + (student ? student.matric_number : '-') +
            ' | Level: ' + (student ? student.level : '-') + '</p>' +
            '<p>' + fileLink + ' | Submitted: ' + new Date(s.submitted_at).toLocaleDateString() + '</p>' +
          '</div>' +
          scoreHTML +
        '</div>';
    });
  }

  async function gradeSubmission(submissionId) {
    var scoreInput = document.getElementById('score-' + submissionId);
    var score = parseInt(scoreInput.value);

    if (isNaN(score),  score < 0 , score > 100) {
      alert('Enter a valid score between 0 and 100.');
      return;
    }

    var update = await supabaseClient
      .from('submissions')
      .update({ score: score })
      .eq('id', submissionId);

    if (update.error) {
      alert('Error: ' + update.error.message);
      return;
    }

    loadSubmissions();
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  }
</script>

</body>
</html>
