<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lecturer Dashboard</title>
  <style>
    /* CSS Variables - Green Theme */
    :root {
      --primary: #16a34a;
      --primary-hover: #15803d;
      --bg: #f0f4f8;
      --surface: #ffffff;
      --text: #1a1a2e;
      --text-light: #ffffff;
      --text-muted: #666666;
      --border: #e5e5e5;
    }

    /* Dark Mode */
    [data-theme="dark"] {
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --bg: #1e293b;
      --surface: #334155;
      --text: #f0f4f8;
      --text-muted: #94a3b8;
      --border: #475569;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); padding: 20px; transition: all 0.3s; }
    .dashboard { max-width: 900px; margin: 0 auto; }

    .top-bar {
      background: var(--primary);
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .top-bar h2 { font-size: 18px; }
    .top-bar span { font-size: 13px; opacity: 0.8; }
    .logout-btn {
      background: white;
      color: var(--primary);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 2px solid var(--primary);
      background: var(--surface);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      color: var(--primary);
    }

    .tab-btn.active { background: var(--primary); color: white; }

    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: background 0.3s;
    }

    .card h3 { font-size: 16px; margin-bottom: 16px; color: var(--text); }

    input, select, textarea {
      width: 100%;
      padding: 11px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: var(--surface);
      color: var(--text);
    }

    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 80px; }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .btn:hover { background: var(--primary-hover); }

    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      color: white;
    }

    .btn-edit { background: #0ea5e9; }
    .btn-delete { background: #ef4444; }
    .btn-grade { background: #16a34a; }
    .btn-save { background: #16a34a; }

    .assignment-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .assignment-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .assignment-header h4 { color: var(--text); font-size: 15px; }
    .assignment-actions { display: flex; gap: 8px; }

    .badge {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 6px;
      margin-bottom: 8px;
    }

    .badge-course { background: #dcfce7; color: #16a34a; }

    .edit-form {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-top: 12px;
    }

    .submission-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .submission-info h4 { font-size: 14px; color: var(--text); }
    .submission-info p { font-size: 13px; color: var(--text-muted); }
    .grade-section { display: flex; align-items: center; gap: 8px; }
    .grade-section input { width: 80px; margin: 0; padding: 7px; }

    .score-tag {
      background: #fef9c3;
      color: #854d0e;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
    }

    .message { margin-top: 12px; font-size: 14px; font-weight: 500; }
    .success { color: #16a34a; }
    .error { color: #ef4444; }
    .hidden { display: none; }
    .loading { text-align: center; padding: 30px; color: var(--text-muted); }
    .empty { text-align: center; padding: 30px; color: var(--text-muted); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: var(--surface);
      border-radius: 14px;
      padding: 28px;
      width: 90%;
      max-width: 480px;
    }

    .modal h3 { margin-bottom: 16px; color: var(--text); }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-cancel { background: var(--border); color: var(--text); }
  </style>
</head>
<body>

<div class="dashboard">

  <div class="top-bar">
    <div>
      <h2> Lecturer Dashboard</h2>
      <span id="lecturer-name">Loading...</span>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('my-courses', this)"> My Courses</button>
    <button class="tab-btn" onclick="showTab('upload', this)"> Upload Assignment</button>
    <button class="tab-btn" onclick="showTab('assignments', this)"> My Assignments</button>
    <button class="tab-btn" onclick="showTab('submissions', this)"> Submissions</button>
  </div>

  <!-- MY COURSES -->
  <div id="my-courses" class="tab-content">
    <div class="card">
      <h3> My Assigned Courses</h3>
      <div id="courses-list"><div class="loading">Loading...</div></div>
    </div>
  </div>

  <!-- UPLOAD ASSIGNMENT -->
  <div id="upload" class="tab-content hidden">
    <div class="card">
      <h3>Upload New Assignment</h3>
      <select id="a-course"><option value="">-- Select Your Course --</option></select>
      <input type="text" id="a-title" placeholder="Assignment Title"/>
      <textarea id="a-desc" placeholder="Assignment Description / Instructions"></textarea>
      <input type="date" id="a-deadline"/>
      <input type="file" id="a-file" accept=".pdf,image/*"/>
      <button class="btn" onclick="uploadAssignment()">Upload Assignment</button>
      <p id="upload-msg" class="message"></p>
    </div>
  </div>

  <!-- MY ASSIGNMENTS -->
  <div id="assignments" class="tab-content hidden">
    <div class="card">
      <h3>My Uploaded Assignments</h3>
      <div id="assignments-list"><div class="loading">Loading...</div></div>
    </div>
  </div>

  <!-- SUBMISSIONS -->
  <div id="submissions" class="tab-content hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
  <h3 style="margin:0;">Student Submissions</h3>
  <button class="btn-small btn-grade" id="export-btn" onclick="exportSubmissions()" style="display:none;"> Export CSV</button>
</div>
      <select id="filter-assignment" onchange="loadSubmissions()">
        <option value="">-- Select Assignment --</option>
      </select>
      <div id="submissions-list"><div class="empty">Select an assignment above.</div></div>
    </div>
  </div>

</div>

<!-- EDIT ASSIGNMENT MODAL -->
<div class="modal-overlay" id="edit-modal" style="display:none;">
  <div class="modal">
    <h3> Edit Assignment</h3>
    <input type="hidden" id="edit-id"/>
    <input type="text" id="edit-title" placeholder="Assignment Title"/>
    <textarea id="edit-desc" placeholder="Description"></textarea>
    <input type="date" id="edit-deadline"/>
    <div class="modal-actions">
      <button class="btn" onclick="saveEdit()"> Save Changes</button>
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
    <p id="edit-msg" class="message"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  var currentUser = null;
  var currentProfile = null;
  var myCourses = [];

  window.onload = async function() {
  document.getElementById('edit-modal').classList.add('hidden'); // ADD THIS LINE
  
  var session = await supabaseClient.auth.getSession();
  // ... rest of the code
    var session = await supabaseClient.auth.getSession();
    if (!session.data.session) { window.location.href = 'index.html'; return; }
    currentUser = session.data.session.user;

    var profile = await supabaseClient.from('users').select('*').eq('id', currentUser.id).single();
    if (!profile.data || profile.data.role !== 'lecturer') { window.location.href = 'index.html'; return; }

    currentProfile = profile.data;
    document.getElementById('lecturer-name').textContent = 'Welcome, ' + currentProfile.full_name;

    loadMyCourses();
    loadMyAssignments();
    loadAssignmentFilter();
  };

  function showTab(tabName, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabName).classList.remove('hidden');
    btn.classList.add('active');
  }

  async function loadMyCourses() {
    var list = document.getElementById('courses-list');
    var result = await supabaseClient.from('courses').select('*').eq('lecturer_id', currentUser.id).order('level');

    if (!result.data || result.data.length === 0) {
      list.innerHTML = '<div class="empty">No courses assigned.</div>';
      return;
    }

    myCourses = result.data;
    list.innerHTML = '';
    result.data.forEach(function(c) {
      list.innerHTML +=
        '<div style="border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;">' +
          '<div><strong style="color:#1a1a2e">' + c.name + '</strong><p style="color:#888;font-size:13px;margin-top:4px;">' + c.code + '</p></div>' +
          '<span class="badge">' + c.level + '</span>' +
        '</div>';
    });
    populateCourseDropdown(result.data);
  }

  function populateCourseDropdown(courses) {
    var select = document.getElementById('a-course');
    select.innerHTML = '<option value="">-- Select Your Course --</option>';
    courses.forEach(function(c) {
      select.innerHTML += '<option value="' + c.id + '">' + c.name + ' (' + c.level + ')</option>';
    });
  }

  async function uploadAssignment() {
    var courseId = document.getElementById('a-course').value;
    var title = document.getElementById('a-title').value.trim();
    var desc = document.getElementById('a-desc').value.trim();
    var deadline = document.getElementById('a-deadline').value;
    var file = document.getElementById('a-file').files[0];
    var msg = document.getElementById('upload-msg');

    if (!courseId || !title) {
      msg.textContent = 'Please select a course and enter a title.';
      msg.className = 'message error';
      return;
    }

    msg.textContent = 'Uploading...';
    msg.className = 'message';

    var selectedCourse = myCourses.find(function(c) { return c.id === courseId; });
    var fileUrl = null;

    if (file) {
      var fileName = 'assignments/' + currentUser.id + '-' + Date.now() + '-' + file.name;
      var upload = await supabaseClient.storage.from('submissions').upload(fileName, file);
      if (upload.error) {
        msg.textContent = 'File error: ' + upload.error.message;
        msg.className = 'message error';
        return;
      }
      fileUrl = supabaseClient.storage.from('submissions').getPublicUrl(fileName).data.publicUrl;
    }

    var insert = await supabaseClient.from('assignments').insert([{
      title, description: desc, level: selectedCourse.level,
      course_id: courseId, deadline: deadline || null,
      file_url: fileUrl, lecturer_id: currentUser.id
    }]);

    if (insert.error) {
      msg.textContent = 'Error: ' + insert.error.message;
      msg.className = 'message error';
      return;
    }

    msg.textContent = ' Assignment uploaded!';
    msg.className = 'message success';
    document.getElementById('a-course').value = '';
    document.getElementById('a-title').value = '';
    document.getElementById('a-desc').value = '';
    document.getElementById('a-deadline').value = '';
    document.getElementById('a-file').value = '';
    loadMyAssignments();
    loadAssignmentFilter();
  }

  async function loadMyAssignments() {
    var list = document.getElementById('assignments-list');
    var result = await supabaseClient
      .from('assignments').select('*, courses(name, code)')
      .eq('lecturer_id', currentUser.id)
      .order('created_at', { ascending: false });

    if (!result.data || result.data.length === 0) {
      list.innerHTML = '<div class="empty">No assignments yet.</div>';
      return;
    }

    list.innerHTML = '';
    result.data.forEach(function(a) {
      var courseName = a.courses ? a.courses.name : 'Unknown';
      var deadline = a.deadline ? '⏰ ' + a.deadline : 'No deadline';
      var fileLink = a.file_url
        ? '<a href="' + a.file_url + '" target="_blank" style="font-size:13px;color:#4f46e5;">📎 View File</a>'
        : '';

      list.innerHTML +=
        '<div class="assignment-item">' +
          '<div class="assignment-header">' +
            '<div>' +
              '<span class="badge">' + a.level + '</span>' +
              '<span class="badge badge-course">' + courseName + '</span>' +
              '<h4>' + a.title + '</h4>' +
            '</div>' +
            '<div class="assignment-actions">' +
              '<button class="btn-small btn-edit" onclick="openEditModal(this)" data-id="' + a.id + '" data-title="' + escapeStr(a.title) + '" data-desc="' + escapeStr(a.description  ,'') + '" data-deadline="' + (a.deadline  ,'') + '"> Edit</button>' +
              '<button class="btn-small btn-delete" onclick="deleteAssignment(\'' + a.id + '\')"> Delete</button>' +
            '</div>' +
          '</div>' +
          '<p style="color:#666;font-size:13px;">' + (a.description || '') + '</p>' +
          '<p style="color:#999;font-size:12px;margin-top:6px;">' + deadline + '</p>' +
          fileLink +
        '</div>';
    });
  }

  function escapeStr(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function openEditModal(btn) {
  var id = btn.getAttribute('data-id');
  var title = btn.getAttribute('data-title');
  var desc = btn.getAttribute('data-desc');
  var deadline = btn.getAttribute('data-deadline');
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-title').value = title;
  document.getElementById('edit-desc').value = desc;
  document.getElementById('edit-deadline').value = deadline;
  document.getElementById('edit-msg').textContent = '';
  document.getElementById('edit-modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('edit-modal').style.display = 'none';
  }
  

  async function saveEdit() {
    var id = document.getElementById('edit-id').value;
    var title = document.getElementById('edit-title').value.trim();
    var desc = document.getElementById('edit-desc').value.trim();
    var deadline = document.getElementById('edit-deadline').value;
    var msg = document.getElementById('edit-msg');

    if (!title) {
      msg.textContent = 'Title cannot be empty.';
      msg.className = 'message error';
      return;
    }

    var update = await supabaseClient
      .from('assignments')
      .update({ title, description: desc, deadline: deadline || null })
      .eq('id', id);

    if (update.error) {
      msg.textContent = 'Error: ' + update.error.message;
      msg.className = 'message error';
      return;
    }

    msg.textContent = ' Updated!';
    msg.className = 'message success';
    setTimeout(function() {
      closeModal();
      loadMyAssignments();
      loadAssignmentFilter();
    }, 1000);
  }

  async function deleteAssignment(id) {
  if (!confirm('Delete this assignment and all its submissions?')) return;

  // First delete all submissions for this assignment
  var delSubs = await supabaseClient
    .from('submissions')
    .delete()
    .eq('assignment_id', id);

  if (delSubs.error) {
    alert('Error deleting submissions: ' + delSubs.error.message);
    return;
  }

  // Then delete the assignment
  var delAssign = await supabaseClient
    .from('assignments')
    .delete()
    .eq('id', id);

  if (delAssign.error) {
    alert('Error deleting assignment: ' + delAssign.error.message);
    return;
  }

  alert(' Assignment deleted successfully!');
  loadMyAssignments();
  loadAssignmentFilter();
}

  async function loadAssignmentFilter() {
    var select = document.getElementById('filter-assignment');
    var result = await supabaseClient
      .from('assignments').select('*, courses(name)')
      .eq('lecturer_id', currentUser.id)
      .order('created_at', { ascending: false });

    if (result.error) return;
    select.innerHTML = '<option value="">-- Select Assignment --</option>';
    result.data.forEach(function(a) {
      select.innerHTML += '<option value="' + a.id + '">' + a.title + ' (' + a.level + ')</option>';
    });
  }

  async function loadSubmissions() {
    var assignmentId = document.getElementById('filter-assignment').value;
    var list = document.getElementById('submissions-list');
    if (!assignmentId) { list.innerHTML = '<div class="empty">Select an assignment.</div>'; return; }

    list.innerHTML = '<div class="loading">Loading...</div>';

    var result = await supabaseClient
      .from('submissions')
      .select('*, users(full_name, matric_number, level)')
      .eq('assignment_id', assignmentId)
      .order('submitted_at', { ascending: false });

    if (!result.data || result.data.length === 0) {
      list.innerHTML = '<div class="empty">No submissions yet.</div>';
      return;
    }

    list.innerHTML = '';
    result.data.forEach(function(s) {
      var student = s.users;
      var scoreHTML = s.score !== null
        ? '<div class="grade-section">' +
            '<span class="score-tag">Score: ' + s.score + '</span>' +
            '<input type="number" id="score-' + s.id + '" placeholder="Edit" min="0" max="100" style="width:80px;margin:0;padding:7px;"/>' +
            '<button class="btn-small btn-save" onclick="gradeSubmission(\'' + s.id + '\')">Update</button>' +
          '</div>'
        : '<div class="grade-section">' +
            '<input type="number" id="score-' + s.id + '" placeholder="0-100" min="0" max="100"/>' +
            '<button class="btn-small btn-grade" onclick="gradeSubmission(\'' + s.id + '\')">Save Grade</button>' +
          '</div>';

      var fileLink = s.file_url
        ? '<a href="' + s.file_url + '" target="_blank" style="font-size:13px;color:#0ea5e9;">📎 View</a>'
        : 'No file';

      list.innerHTML +=
        '<div class="submission-item">' +
          '<div class="submission-info">' +
            '<h4>' + (student ? student.full_name : 'Unknown') + '</h4>' +
            '<p>Matric: ' + (student ? student.matric_number : '-') + ' | Level: ' + (student ? student.level : '-') + '</p>' +
            '<p>' + fileLink + ' | ' + new Date(s.submitted_at).toLocaleDateString() + '</p>' +
          '</div>' +
          scoreHTML +
        '</div>';
    });
    document.getElementById('export-btn').style.display = 
  result.data.length > 0 ? 'block' : 'none';
  }

  async function gradeSubmission(submissionId) {
    var score = parseInt(document.getElementById('score-' + submissionId).value);
    if (isNaN(score) , score < 0 , score > 100) {
      alert('Enter a valid score between 0 and 100.');
      return;
    }

    var update = await supabaseClient.from('submissions').update({ score }).eq('id', submissionId);
    if (update.error) { alert('Error: ' + update.error.message); return; }
    loadSubmissions();
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  }
  document.getElementById('edit-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function exportSubmissions() {
  var assignmentTitle = document.getElementById('filter-assignment').options[
    document.getElementById('filter-assignment').selectedIndex
  ].text;

  var rows = [['Student Name', 'Matric Number', 'Level', 'Submitted Date', 'Score', 'Status']];
  var items = document.querySelectorAll('.submission-item');

  items.forEach(function(item) {
    var name = item.querySelector('h4') ? item.querySelector('h4').textContent.trim() : '-';
    var details = item.querySelector('p') ? item.querySelector('p').textContent.trim() : '';
    var matric = details.split('|')[0].replace('Matric:', '').trim();
    var level = details.split('|')[1] ? details.split('|')[1].replace('Level:', '').trim() : '-';
    var scoreTag = item.querySelector('.score-tag');
    var score = scoreTag ? scoreTag.textContent.replace('Score:', '').trim() : 'Not graded';
    var status = scoreTag ? 'Graded' : 'Submitted - Awaiting Grade';
    var dateEl = item.querySelectorAll('p')[1];
    var date = dateEl ? dateEl.textContent.split('|')[1] : '-';

    rows.push([name, matric, level, date ? date.trim() : '-', score, status]);
  });

  var csv = rows.map(function(r) {
    return r.map(function(c) { return '"' + c + '"'; }).join(',');
  }).join('\n');

  var blob = new Blob([csv], { type: 'text/csv' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = assignmentTitle.replace(/[^a-z0-9]/gi, '_') + '_submissions.csv';
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
