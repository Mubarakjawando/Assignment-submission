<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body {
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .icon { text-align: center; font-size: 48px; margin-bottom: 12px; }
    h2 { text-align: center; color: #1a1a2e; margin-bottom: 8px; }
    p.subtitle {
      text-align: center;
      color: #166534;
      font-size: 13px;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #16a34a; }
    button {
      width: 100%;
      padding: 13px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #15803d; }
    .message {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
    }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔐</div>
    <h2>Set New Password</h2>
    <p class="subtitle">Enter your new password below</p>

    <input type="password" id="new-password" placeholder="New Password"/>
    <input type="password" id="confirm-password" placeholder="Confirm New Password"/>
    <button onclick="updatePassword()">Update Password</button>
    <p id="update-msg" class="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    async function updatePassword() {
      var newPassword = document.getElementById('new-password').value;
      var confirm = document.getElementById('confirm-password').value;
      var msg = document.getElementById('update-msg');

      if (!newPassword || !confirm) {
        msg.textContent = 'Please fill in both fields.';
        msg.className = 'message error';
        return;
      }

      if (newPassword !== confirm) {
        msg.textContent = 'Passwords do not match.';
        msg.className = 'message error';
        return;
      }

      if (newPassword.length < 6) {
        msg.textContent = 'Password must be at least 6 characters.';
        msg.className = 'message error';
        return;
      }

      var result = await supabaseClient.auth.updateUser({
        password: newPassword
      });

      if (result.error) {
        msg.textContent = 'Error: ' + result.error.message;
        msg.className = 'message error';
        return;
      }

      msg.textContent = ' Password updated! Redirecting to login...';
      msg.className = 'message success';

      setTimeout(function() {
        window.location.href = 'index.html';
      }, 2000);
    }
  </script>
</body>
</html>
